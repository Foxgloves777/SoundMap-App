# SoundMap — static site in public/ plus one function behind /api/*.
# GEMINI_API_KEY must be set in Netlify → Site configuration → Environment variables.

[build]
  publish = "public"
  command = "echo 'No build step'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
